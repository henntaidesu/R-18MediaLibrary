<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>R18媒体库</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="drawerBackdrop" class="drawer-backdrop" onclick="closeDrawer()"></div>
<aside id="nav" class="nav"></aside>
<div class="main-wrap">
  <header>
    <div id="topbar" class="topbar">
      <button id="menuBtn" class="icon-btn" onclick="toggleDrawer()" title="目录" aria-label="目录">☰ 目录</button>
      <button id="back" class="icon-btn" hidden>← 返回</button>
      <span id="title" class="title">媒体库</span>
      <input id="search" class="grow" type="search" placeholder="搜索 RJ号 / 作品名 / 社团" autocomplete="off" hidden>
      <button id="libToggle" class="icon-btn" hidden></button>
      <select id="sort" hidden></select>
      <div id="detailActions" class="topbar-actions" hidden></div>
      <button id="helpBtn" class="icon-btn help-btn" title="使用帮助" aria-label="使用帮助">?</button>
    </div>
  </header>
  <main>
    <div id="count" class="count"></div>
    <div id="content"></div>
  </main>
</div>

<div id="lightbox" class="lightbox">
  <button class="lb-btn lb-close" onclick="LB.close()">✕</button>
  <button class="lb-btn lb-prev" onclick="LB.step(-1)">‹</button>
  <img id="lbimg" alt="">
  <button class="lb-btn lb-next" onclick="LB.step(1)">›</button>
</div>

<div id="picker" class="overlay"><div class="card2" id="pickerBox"></div></div>

<div id="modal" class="overlay"><div class="card2" id="modalBox"></div></div>

<!-- 使用帮助：各页面的 ? 按钮从右侧拉出，显示使用手册对应章节（help.js） -->
<div id="helpBackdrop" class="help-backdrop" onclick="closeHelp()"></div>
<aside id="helpPanel" class="help-panel" aria-label="使用帮助">
  <div class="help-head">
    <span class="help-title">? 使用帮助</span>
    <select id="helpChapter" class="grow"></select>
    <select id="helpLang"></select>
    <button class="icon-btn" onclick="closeHelp()" title="关闭">✕</button>
  </div>
  <div id="helpBody" class="help-body"></div>
  <div class="help-foot">
    <button id="helpPrev" class="icon-btn">‹ 上一章</button>
    <button id="helpNext" class="icon-btn">下一章 ›</button>
  </div>
</aside>

<div id="videoOverlay" class="voverlay">
  <div class="vtop">
    <button class="icon-btn" id="vprev" onclick="videoPrev()">‹ 上一个</button>
    <button class="icon-btn" id="vnext" onclick="videoNext()">下一个 ›</button>
    <span id="vtitle" class="vtitle"></span>
    <button class="icon-btn" onclick="closeVideo()">✕ 关闭</button>
  </div>
  <video id="vplayer" controls playsinline></video>
</div>

<!-- 远程串流：作品里的 Windows 程序在电脑上运行，画面传到这里操作（stream.js） -->
<div id="streamOverlay" class="soverlay">
  <div class="vtop">
    <span id="stitle" class="vtitle"></span>
    <button class="icon-btn" id="saudio" onclick="GS.toggleAudio()">🔇 声音</button>
    <button class="icon-btn" id="skeys" onclick="GS.toggleKeys()">⌨ 按键</button>
    <button class="icon-btn" onclick="GS.typeText()">Aa 输入文字</button>
    <button class="icon-btn" onclick="GS.fullscreen()">⛶ 全屏</button>
    <button class="icon-btn danger" id="squit" onclick="GS.quit()">⏻ 结束程序</button>
    <button class="icon-btn" onclick="GS.close()">✕ 关闭</button>
  </div>
  <div id="sstage" class="sstage"><canvas id="scanvas"></canvas><div id="smsg" class="smsg"></div></div>
  <div id="spad" class="spad"></div>
</div>

<div id="audioBar" class="abar">
  <span id="aname" class="aname"></span>
  <audio id="aplayer" controls></audio>
  <div class="actrls">
    <button class="icon-btn" id="aprev" onclick="audioPrev()" title="上一曲">⏮</button>
    <button class="icon-btn" id="anext" onclick="audioNext()" title="下一曲">⏭</button>
    <span class="spacer"></span>
    <button class="icon-btn" id="aplaylistBtn" onclick="toggleAudioPlaylist()" title="播放列表">☰</button>
    <button class="icon-btn" id="asleepBtn" onclick="toggleSleepMenu()" title="睡眠定时">⏱</button>
    <button class="icon-btn" onclick="closeAudio()" title="关闭">✕</button>
  </div>
</div>
<div id="audioPlaylist" class="apopup"></div>
<div id="sleepMenu" class="apopup"></div>

<div id="login" class="login">
  <form class="box" onsubmit="doLogin(); return false;">
    <h2 id="loginTitle">需要访问密码</h2>
    <div id="loginErr" class="err"></div>
    <div id="pwPart">
      <!-- 隐藏用户名字段：让浏览器把保存的凭据锚定到本登录表单，而非误填到搜索/设置等文本框 -->
      <input type="text" name="username" value="dlsite" autocomplete="username" tabindex="-1" aria-hidden="true" style="display:none">
      <input id="pw" type="password" placeholder="密码" autocomplete="current-password">
      <button type="submit">进入</button>
    </div>
    <!-- 门户单点登录：桌面端「系统设置 → 门户单点登录」开启后才出现（/api/state 的 sso） -->
    <div id="ssoOr" class="or" hidden><span>或</span></div>
    <button id="ssoBtn" type="button" class="sso" onclick="ssoLogin()" hidden>门户登录</button>
  </form>
</div>

<script src="/js/core.js"></script>
<script src="/js/library.js"></script>
<script src="/js/search.js"></script>
<script src="/js/fanbox.js"></script>
<script src="/js/ehentai.js"></script>
<script src="/js/pixiv.js"></script>
<script src="/js/download.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/watch.js"></script>
<script src="/js/accounts.js"></script>
<script src="/js/viewer.js"></script>
<script src="/js/stream.js"></script>
<script src="/js/help.js"></script>
<script src="/js/boot.js"></script>
</body>
</html>
